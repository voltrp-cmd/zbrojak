<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: stránka využije celý displej i u telefonů s výřezem -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Barva horní lišty prohlížeče na mobilu -->
  <meta name="theme-color" content="#1f5fbf">
  <title>Zbroják</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Nauka pro zbrojní průkaz</h1>

    <!-- Kartička s jednou otázkou -->
    <section class="karta">
      <p id="pocitadlo" class="pocitadlo"></p>
      <!-- Obrázek k otázce (jen u některých otázek, jinak je skrytý).
           Je nad textem otázky, stejně jako v PDF („výše vyobrazený…“). -->
      <img id="obrazek" class="obrazek" alt="" hidden>
      <h2 id="otazka" class="otazka"></h2>

      <!-- Sem app.js vloží tlačítka s odpověďmi -->
      <div id="odpovedi" class="odpovedi"></div>

      <!-- Tlačítko je na začátku skryté (atribut hidden) -->
      <button id="dalsi" class="tlacitko-dalsi" hidden>Další otázka</button>
    </section>
  </main>

  <!-- Skript načítáme až na konci, aby už existovaly všechny prvky stránky -->
  <script src="app.js"></script>
  <!-- Ladicí nástroje se načtou jen s ?ladeni=1 v adrese (např. http://localhost:8080/?ladeni=1).
       DOČASNÉ: posuvník pro kontrolu otázek (po kontrole smazat i soubor posuvnik.js). -->
  <script>
    if (new URLSearchParams(location.search).get("ladeni") === "1") {
      const skript = document.createElement("script");
      skript.src = "posuvnik.js";
      document.body.appendChild(skript);
    }
  </script>
</body>
</html>
